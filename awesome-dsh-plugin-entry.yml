url: https://github.com/randomix777/dsh-godot-sprite
name: randomix777/dsh-godot-sprite
category: tools
description:
  en: Godot sprite sheet generator with AI image generation support for 11+ providers including Gemini, DeepSeek, OpenAI DALL-E 3, Stable Diffusion, Flux, and more. Generates pixel art sprites, auto-crops transparent edges, and arranges them into Godot-compatible grids.
  zh: Godot 精灵图生成器，支持 11+ 种 AI 图片生成服务商（Gemini、DeepSeek、OpenAI DALL-E 3、Stable Diffusion、Flux 等）。自动裁剪透明边、网格排列，输出与 Godot AnimationPlayer 兼容的精灵图集。
