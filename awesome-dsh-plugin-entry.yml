name: randomix777/dsh-godot-sprite
category: tools
description:
  en: Godot sprite sheet generator with AI image generation using free providers (Gemini Flash, Stable Diffusion). Auto-crops transparent edges and arranges sprites into Godot-compatible grids.
  zh: Godot 精灵图生成器，使用免费 AI 图片生成服务（Gemini Flash、Stable Diffusion）。自动裁剪透明边、网格排列，输出与 Godot AnimationPlayer 兼容的精灵图集。
