# Sprite Sheet Generator - DSH Plugin Configuration
#
# Supports AI image generation
# Plugin ID: sprite-gen (matches cordis namespace) and sprite sheet creation
# with settings panel in DSH UI.
#
# Usage in cordis.patch.yml:
#   - id: sprite-gen
#     name: 'dsh-sprite-gen'

- insert:
  - id: sprite-gen
    name: './lib/index.js'
